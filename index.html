<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦当劳自助管家 McButler</title>
<style>
  :root{--red:#DA291C;--yellow:#FFC72C}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 520px at 20% -10%, rgba(218,41,28,.55), transparent 62%),
      radial-gradient(760px 460px at 88% 4%, rgba(255,199,44,.26), transparent 60%),
      linear-gradient(170deg,#141019 0%,#1d1420 46%,#120e16 100%);
  }
  .card{max-width:720px;padding:44px 40px;text-align:center}
  .kicker{font-size:12px;letter-spacing:.32em;color:var(--yellow);text-transform:uppercase}
  h1{font-size:40px;margin:14px 0 10px;letter-spacing:.02em}
  h1 span{color:var(--yellow)}
  p.lead{color:#cfc9dc;line-height:1.8;font-size:15px;margin:0 auto 28px;max-width:560px}
  .caps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:32px}
  .caps span{
    font-size:12px;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e9e4f5
  }
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{
    text-decoration:none;padding:13px 26px;border-radius:999px;font-size:14px;font-weight:700;
    transition:transform .15s, box-shadow .2s;display:inline-block
  }
  a.primary{background:var(--red);color:#fff;box-shadow:0 16px 34px -18px rgba(218,41,28,.9)}
  a.ghost{border:1px solid rgba(255,255,255,.22);color:#fff;background:rgba(255,255,255,.05)}
  a.btn:hover{transform:translateY(-2px)}
  footer{margin-top:34px;font-size:12px;color:#8b8598;line-height:1.9}
  @media(max-width:560px){h1{font-size:29px}.card{padding:30px 22px}}
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">McDonald's 1024 · Skill Challenge</div>
    <h1>麦当劳<span>自助管家</span></h1>
    <p class="lead">
      基于麦当劳官方 MCP 的点单参谋：把「省钱」「健康」「省时间」三个约束同时解开。
      套餐热量靠 <code>query-meal-detail</code> 拆解后逐项对表算出来，不是猜的。
    </p>
    <div class="caps">
      <span>每日推荐</span><span>健康体检</span><span>门店全成本比价</span>
      <span>团餐智能配餐</span><span>麦险分</span><span>麦门小剧场</span>
    </div>
    <div class="row">
      <a class="btn primary" href="./demo/theater.html">看麦门小剧场 ▶</a>
      <a class="btn ghost" href="https://github.com/jouaaaaaa/mcd-self-butler">GitHub 仓库</a>
    </div>
    <footer>
      参赛作品，非麦当劳官方产品 · 营养数据仅供参考，不构成医疗建议<br>
      餐品信息、价格与供应状态以麦当劳官方渠道为准
    </footer>
  </div>
</body>
</html>
